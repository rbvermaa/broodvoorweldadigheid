{# chart: components::BarChart. The same numbers belong in a table on the page too. #}
{% macro bar_chart(chart) %}
<figure class="chart">
<svg class="chart-svg" viewBox="0 0 640 {{ chart.height }}" role="img" aria-labelledby="{{ chart.id }}-title">
<title id="{{ chart.id }}-title">{{ chart.caption }}</title>
{%- for bar in chart.bars %}
<text class="chart-label" x="0" y="{{ bar.label_y }}">{{ bar.label }}</text>
<rect class="chart-bar" x="0" y="{{ bar.y }}" width="{{ bar.width }}" height="24"></rect>
<text class="chart-value" x="{{ bar.value_x }}" y="{{ bar.value_y }}">{{ bar.value }}</text>
{%- endfor %}
</svg>
<figcaption class="chart-caption">{{ chart.caption }}</figcaption>
</figure>
{% endmacro %}
