{% extends "base.html" %}
{% block title %}{{ layout.t("staff-title")? }}{% endblock %}
{% block content %}
<h1>{{ layout.t("staff-title")? }}</h1>
<p>{{ layout.t("staff-signed-in-as")? }} <strong>{{ name }}</strong> ({{ layout.t(role)? }})</p>
<p>{{ layout.t("staff-intro")? }}</p>
<form method="post" action="/staff/logout">
<input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">
<button type="submit">{{ layout.t("staff-logout")? }}</button>
</form>
{% endblock %}
