name: check

on:
  push:
    branches-ignore:
      - gh-readonly-queue/**
  merge_group:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v16
        with:
          name: rbvermaa
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: make ci-deps

  check:
    name: check (${{ matrix.name }})
    needs: deps
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cheap
            targets: fmt-check deny audit layers unsafe-forbid adr-numbers
          - name: clippy
            targets: lint
          - name: nextest
            targets: nextest
          - name: coverage
            targets: coverage-report coverage
          - name: sqlx-prepare
            targets: sqlx-check
          - name: restore
            targets: restore-test
          - name: image-contents
            targets: image-contents
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v16
        with:
          name: rbvermaa
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: make --keep-going ${{ matrix.targets }}

  smoke:
    needs: deps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v16
        with:
          name: rbvermaa
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: make images
      - run: make smoke SMOKE_ARGS=--keep-on-failure
      - if: failure()
        run: |
          for c in $(docker ps --all --quiet --filter label=com.docker.compose.project=bvw-smoke); do
            echo "== $(docker inspect --format "{{.Name}}" "$c")"
            docker logs --timestamps "$c" 2>&1
          done > compose.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: compose.log
          if-no-files-found: ignore

  ci-ok:
    if: always()
    needs: [deps, check, smoke]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || exit 1
          done
