name: check

on:
  push:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: write # cache-nix-action purges old caches
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-last-accessed: P7D
          purge-primary-key: never
      - run: make check

  smoke:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          save: false
      - run: make images
      - run: make smoke SMOKE_ARGS=--keep-on-failure
      - if: failure()
        run: |
          for c in $(docker ps --all --quiet --filter label=com.docker.compose.project=bvw-smoke); do
            echo "== $(docker inspect --format "{{.Name}}" "$c")"
            docker logs --timestamps "$c" 2>&1
          done > compose.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs-${{ runner.arch }}
          path: compose.log
          if-no-files-found: ignore
