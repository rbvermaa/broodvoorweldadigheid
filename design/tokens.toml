# Design tokens (spec: "Design system and UX"). apps/server/build.rs turns this file into
# CSS variables (--color-ink, --space-2, ...) and fails the build on invalid tokens.
# Colours are #rrggbb only. Every [[pair]] is checked against WCAG 2.2 AA contrast:
# 4.5:1, or 3:1 with large-text = true.

[color]
# Style "Stempel" (ADR 0023): ink on paper like the logo, no accent colour. Greys are for
# muted text, disabled states and photo placeholders only.
ink = "#111111"
paper = "#ffffff"
grey-50 = "#fafafa"
grey-100 = "#f5f5f5"
grey-200 = "#e5e5e5"
grey-400 = "#a3a3a3"
grey-600 = "#525252"
grey-800 = "#262626"

text = "#111111"
text-muted = "#525252"
surface = "#ffffff"
surface-muted = "#f5f5f5"
border = "#111111"

success = "#166534"
warning = "#854d0e"
error = "#b91c1c"
info = "#1e40af"

[font]
heading = ["Oswald", "Arial Narrow", "Roboto Condensed", "sans-serif"]
body = ["Inter", "system-ui", "Segoe UI", "Roboto", "Helvetica Neue", "Arial", "sans-serif"]

[font-size]
xs = "0.75rem"
sm = "0.875rem"
md = "1rem"
lg = "1.125rem"
xl = "1.25rem"
2xl = "1.5rem"
3xl = "2rem"
4xl = "2.5rem"

[font-weight]
regular = 400
medium = 500
bold = 700

[line-height]
tight = "1.2"
normal = "1.5"

# Uppercase Oswald needs a little air, like the logo's lettering.
[letter-spacing]
heading = "0.03em"
label = "0.05em"

[space]
0 = "0"
1 = "0.25rem"
2 = "0.5rem"
3 = "0.75rem"
4 = "1rem"
5 = "1.5rem"
6 = "2rem"
7 = "3rem"
8 = "4rem"

[radius]
none = "0"
sm = "0.25rem"
md = "0.5rem"
lg = "1rem"
xl = "1.25rem"
full = "9999px"

# stamp: cards and panels. rule: the heavy line of the double rule.
[border]
thin = "1px"
thick = "2px"
stamp = "2.5px"
rule = "3px"

# Fixed sizes: icons, touch targets (WCAG 2.2 target size), the reading width and the logo.
[size]
icon = "1.25rem"
icon-lg = "2.5rem"
target = "2.75rem"
tile = "16rem"
content = "48rem"
logo-hero = "13.125rem"
logo-header = "2.75rem"

# ring: the logo's double ring (ink, paper, ink) around round and pill elements. It adds
# 7px outside the element; leave at least --space-2 around it. Its colours must be
# [color] values (checked by apps/server/src/tokens.rs).
[shadow]
sm = "0 1px 2px rgb(0 0 0 / 0.08)"
md = "0 4px 12px rgb(0 0 0 / 0.12)"
lg = "0 12px 32px rgb(0 0 0 / 0.16)"
ring = "0 0 0 2px #111111, 0 0 0 5px #ffffff, 0 0 0 7px #111111"

# Mobile-first min-width breakpoints. CSS variables cannot be used inside @media, so these
# document the values the stylesheets must use.
[breakpoint]
sm = "36rem"
md = "48rem"
lg = "64rem"
xl = "80rem"

[[pair]]
foreground = "grey-600"
background = "grey-200"

[[pair]]
foreground = "text"
background = "surface"

[[pair]]
foreground = "text"
background = "surface-muted"

[[pair]]
foreground = "text-muted"
background = "surface"

[[pair]]
foreground = "text-muted"
background = "surface-muted"

[[pair]]
foreground = "paper"
background = "ink"

[[pair]]
foreground = "success"
background = "surface"

[[pair]]
foreground = "warning"
background = "surface"

[[pair]]
foreground = "error"
background = "surface"

[[pair]]
foreground = "info"
background = "surface"

[[pair]]
foreground = "success"
background = "surface-muted"

[[pair]]
foreground = "warning"
background = "surface-muted"

[[pair]]
foreground = "error"
background = "surface-muted"

[[pair]]
foreground = "info"
background = "surface-muted"

[[pair]]
foreground = "paper"
background = "error"
