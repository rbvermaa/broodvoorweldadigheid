[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
askama = "0.16"
axum = "0.8"
base64 = "0.22"
cargo_metadata = "0.23.1"
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
fluent-bundle = "0.16"
insta = "1"
jiff = { version = "0.2", features = ["serde"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "pool", "ring", "rustls-native-certs", "smtp-transport", "tokio1", "tokio1-rustls"] }
proptest = { version = "1", default-features = false, features = ["std"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
thiserror = "2"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-sessions = { version = "0.15", default-features = false, features = ["axum-core"] }
tower-sessions-sqlx-store = { version = "0.16", features = ["postgres"] }
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
unic-langid = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"


[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.lints.cargo]
unused_dependencies = "deny"
