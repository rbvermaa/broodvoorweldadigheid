[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]

[workspace.lints.rust]
unsafe_code = "forbid"


[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.lints.cargo]
unused_dependencies = "deny"
